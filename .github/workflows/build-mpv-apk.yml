name: Build MPV-only Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Linux desktop (ensure toolchain)
        run: |
          flutter config --no-analytics
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a 64-bit only)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify artifact
        run: |
          ls -la build/app/outputs/flutter-apk/
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-mpv-arm64-apk
          path: build/app/outputs/flutter-apk/**/*.apk
          if-no-files-found: error
